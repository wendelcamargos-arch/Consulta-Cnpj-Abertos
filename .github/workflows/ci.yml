name: CI

# Validação automática da suíte existente. Este workflow VALIDA e NÃO PUBLICA:
# não constrói imagem, não cria release, não envia artefato e não usa segredo.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: a suíte só precisa ler o código.
permissions:
  contents: read

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        # A aplicação vive em projeto/ e os testes carregam fixtures por caminho
        # relativo (data/cache), portanto o diretório de trabalho importa.
        working-directory: projeto

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Sem submódulos: cnpj/ e cnpj- apontam para outro repositório e nenhum
        # teste depende deles.
        with:
          submodules: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # Mesma versão declarada para produção em projeto/render.yaml.
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest é ferramenta de teste, não dependência de produção: fica aqui
          # e não em requirements.txt. Versão fixada na validada na baseline.
          pip install pytest==9.1.1

      - name: Executar suíte
        # `python -m pytest` (e não `pytest`) põe o diretório atual no sys.path.
        # tests/ não é pacote e nem todo módulo de teste ajusta o sys.path por
        # conta própria — a forma de invocação é parte do contrato.
        run: python -m pytest tests -v
